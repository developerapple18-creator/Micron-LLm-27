        newAnalysis:
          type: boolean
          description: Explicit lawyer action to start a new complete analysis after a saved report.
        reportQuestion: { $ref: '#/components/schemas/ReportQuestionLink' }
        clarification: { $ref: '#/components/schemas/ClarificationLink' }
        attachmentIds:
          type: array
          uniqueItems: true
          items: { type: string, format: uuid }
