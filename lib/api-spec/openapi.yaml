        notes: { type: string, maxLength: 5000 }
    FeeReceiptFields:
      type: object
      required: [amount, receivedOn]
      properties:
        amount: { type: string, pattern: '^\d{1,12}(\.\d{1,2})?$' }
        # Calendar-only value: retain YYYY-MM-DD rather than coercing to an instant.
        receivedOn: { type: string, pattern: '^\d{4}-\d{2}-\d{2}$' }
        notes: { type: string, maxLength: 2000 }
    FeeReceiptInput:
      allOf:
        - { $ref: '#/components/schemas/FeeReceiptFields' }
        - type: object
          required: [requestId]
          properties:
            requestId: { type: string, format: uuid }
    FeeReceipt:
      allOf:
