        createdAt: { type: string }
    LegalAcceptancePage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/LegalAcceptance' } }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
    AdminAuditEvent:
      type: object
      required: [id, actorId, actor, action, ip, userAgent, createdAt]
      properties:
        id: { type: string, format: uuid }
        actorId: { type: [string, 'null'] }
        actor:
          anyOf:
            - { $ref: '#/components/schemas/User' }
            - { type: 'null' }
        action: { type: string }
        ip: { type: string }
        userAgent: { type: string }
        createdAt: { type: string }
    AdminAuditPage:
      type: object
      required: [items, total, offset, limit]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/AdminAuditEvent' } }
        total: { type: integer }
        offset: { type: integer }
        limit: { type: integer }
